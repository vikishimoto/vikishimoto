<svg width="900" height="76" viewBox="0 0 900 76" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .shine {
        stroke-dasharray: 140 900;
        stroke-dashoffset: 0;
        animation: run 5s linear infinite;
      }
      @keyframes run {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1040; }
      }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="897" height="73" rx="16" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="897" height="73" rx="16" fill="none" stroke="#232838" stroke-width="1.4"/>
  <rect x="1.5" y="1.5" width="897" height="73" rx="16" fill="none" stroke="url(#border)" stroke-width="1.6" opacity="0.55"/>
  <rect x="1.5" y="1.5" width="897" height="73" rx="16" fill="none" stroke="#A855F7" stroke-width="2" opacity="0.9" class="shine" filter="url(#soft)"/>

  <text x="342.8" y="46.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="24" font-weight="bold" fill="url(#txt)">🌐&#160;&#160;Let's Connect</text>
</svg>