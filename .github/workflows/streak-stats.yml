name: Generate Streak Stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=vikishimoto&theme=tokyonight&hide_border=true&background=0D1117&ring=A855F7&fire=22C55E&currStreakLabel=A855F7&sideLabels=C9D1D9&dates=C9D1D9
          path: github-banners/streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-banners/streak-stats.svg
          git commit -m "Update streak stats" || exit 0
          git push
